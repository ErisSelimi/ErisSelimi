<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Lesson 35 - Slideshow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="slidewrapper">
        <div class="slide">
            <img src="img/pic1.jpg" style="width: 100%;">
        </div>
        <div class="slide">
            <img src="img/pic2.jpg" style="width: 100%;">

    <script src="main.js"></script>
