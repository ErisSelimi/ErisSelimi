<html>
  <body>
    <form>
      <fieldset>
      <legend>Personal informations:</legend>

      <label for="firstname">firstname :</label><br>
      <input type="text" id="firstname" name="firstname" value="John" disabled required><br>

      <label for="lastname">lastname :</label><br>
      <input type="text" id="lastname" name="lastname" required><br>

      <label for="password">Password :</label><br>
      <input type="password" id="password" name="password" size="8" placeholder="password" required><br>

      <label for="email">Email :</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <input type="submit" id="submit" name="submit"><br><br>

      <label>Gender :</label><br>
      <input type="radio" id="male" name="gender" value="male">
      <label for="male">MALE</label><br>

      <input type="radio" id="female" name="gender" value="female">
      <label for="female">FEMALE</label><br>

    <label>Hobbies :</label><br>

<input type="checkbox" id="sport" name="hobbies" value="sport">
<label for="sport">Sport</label><br>

<input type="checkbox" id="music" name="hobbies" value="music">
<label for="music">Music</label><br>

<input type="checkbox" id="reading" name="hobbies" value="reading">
<label for="reading">Reading</label><br>

<input type="checkbox" id="travel" name="hobbies" value="travel">
<label for="travel">Travel</label><br>
<br>
<label for="pet">chose a pet :</label>
<select id="pet" name="pet">
      <option value="dog">Dog</option>
      <option value="cat">Cat</option>
      <option value="Parrot">parrot</option>
</select> <br> <br>

<textarea name="MESSAGE" rows="10" cols="20" maxlength="50"></textarea>
</fieldset>   



    </form>
  </body>
</html>
