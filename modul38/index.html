<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#fff;
        }

        .register-box{
            width:520px;
            margin:40px auto;
        }

        h2{
            font-weight:bold;
        }

        h2 span{
            font-size:30px;
        }

        .free{
            color:gray;
            font-size:18px;
            font-weight:normal;
        }

        .btn-register{
            background:#1ca3b8;
            color:white;
            width:100%;
        }

        .btn-register:hover{
            background:#16889a;
            color:white;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="register-box">

        <h2>
            Please sign up
            <span class="free">It's free!</span>
        </h2>

        <form>

            <div class="row mb-3">

                <div class="col">

                    <input type="text"
                           class="form-control"
                           placeholder="First Name">

                </div>

                <div class="col">

                    <input type="text"
                           class="form-control"
                           placeholder="Last Name">

                </div>

            </div>

            <div class="mb-3">

                <input type="email"
                       class="form-control"
                       placeholder="Email Address">

            </div>

            <div class="row mb-3">

                <div class="col">

                    <input type="password"
                           class="form-control"
                           placeholder="Password">

                </div>

                <div class="col">

                    <input type="password"
                           class="form-control"
                           placeholder="Confirm Password">

                </div>

            </div>

            <button class="btn btn-register">
                Register
            </button>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
